<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf7" />
    <meta name="description" content="Administra tu caja de ahorro y préstamos de forma sencilla." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Mi Caja" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <title>Mi Caja · Intelia</title>
  </head>
  <body class="min-h-screen bg-sand-50 text-ink antialiased">
    <div id="auth-screen" class="min-h-screen">
      <main class="safe-top safe-bottom flex min-h-screen items-center justify-center px-4 py-10">
        <section class="w-full max-w-md">
          <div class="mb-8 flex items-center gap-3"><img src="./icon.svg" class="h-12 w-12 rounded-2xl" alt="" /><div><p class="text-xs font-bold uppercase tracking-[.18em] text-teal-700">Intelia</p><h1 class="text-2xl font-extrabold text-ink">Mi Caja</h1></div></div>
          <div class="card p-6 sm:p-8"><p class="text-sm font-semibold text-teal-700">Bienvenido</p><h2 class="mt-1 text-2xl font-extrabold">Inicia sesión</h2><p class="mt-2 text-sm leading-6 text-slate-500">Entra con tu correo y contraseña para ver la información de tu caja.</p>
            <form id="login-form" class="mt-6 space-y-4"><label class="field-label">Correo electrónico<input class="field" name="email" type="email" autocomplete="username" required placeholder="tu@correo.com" /></label><label class="field-label">Contraseña<input class="field" name="password" type="password" autocomplete="current-password" required /></label><button class="btn-primary w-full" type="submit">Entrar a Mi Caja</button></form>
            <p class="mt-5 text-center text-xs leading-5 text-slate-400">Solo las personas autorizadas pueden entrar. Tus datos se consultan con tu sesión personal.</p>
          </div>
        </section>
      </main>
    </div>
    <div id="app-screen" class="hidden min-h-screen"></div>
    <div id="toast-region" class="pointer-events-none fixed inset-x-0 top-4 z-[100] mx-auto flex max-w-md flex-col gap-2 px-4" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
